<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exampath</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      text-align: center;
    }

    header {
      background: #4f46e5;
      color: white;
      padding: 25px 15px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .container {
      padding: 40px 20px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>Exampath</h1>
    <p>Your path to exam success</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>Welcome to Exampath 🎓</h2>
      <p>Prepare better. Learn smarter. Achieve your goals.</p>
      <button onclick="alert('Welcome to Exampath!')">
        Get Started
      </button>
    </div>
  </div>

  <footer>
    © 2026 Exampath
  </footer>

</body>
  </html>
